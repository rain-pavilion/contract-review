name: tests

# 当前源码回归；未公开的模型/历史报告回放按资产可用性显式跳过。
# 依赖只装运行期必需的 CPU 包；不装 torch / transformers / langgraph。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 固定离线测试模式
        run: |
          echo "ZLQL_ENABLE_LLM=0" >> "$GITHUB_ENV"
          echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
          echo "TRANSFORMERS_OFFLINE=1" >> "$GITHUB_ENV"
          echo "CUDA_VISIBLE_DEVICES=" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements-deploy.txt

      - name: 环境自检
        run: python -m zhilv_qiling_v2.cli doctor

      - name: 单元测试
        run: python -m unittest discover -s zhilv_qiling_v2/tests_v2 -t . -v

      - name: 法条库自证
        run: python zhilv_qiling_v2/reports/experiments/demo_kb.py
