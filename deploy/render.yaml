# Render 蓝图：一条命令拉起一个可访问的 Web 服务
#
# 用法：
#   1. 仓库推到 GitHub
#   2. Render Dashboard → New → Blueprint → 选这个仓库（它会读到本文件）
#   3. 之后 push 即自动部署
#
# 为什么用 docker 而不是 python runtime：
#   Render 的 python runtime 只跑 pip install，装不上 onnxruntime 的系统依赖；
#   docker 走我们自己的 Dockerfile，依赖和本地完全一致，可复现。
services:
  - type: web
    name: zhilv-qiling
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ZLQL_HOST
        value: 0.0.0.0
      - key: ZLQL_PORT
        value: 8000
      - key: ZLQL_RENDER
        value: "1"
      # 前端与审查无需模型；接云端 LLM 时在这里填，代码里不用改
      - key: ZLQL_LLM_ENDPOINT
        value: ""
      - key: ZLQL_LLM_MODEL
        value: ""
      - key: ZLQL_LLM_API_KEY
        sync: false
